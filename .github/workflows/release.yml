name: Release

# Produces platform artifacts on a version tag push (e.g. v0.1.0):
#   - jarjard daemon binaries: linux/amd64, linux/arm64 (the daemon is Linux-only
#     by design — it drives systemd + RCON)
#   - tray-client installers: Windows (NSIS .exe), macOS (.dmg, universal),
#     Linux (.AppImage + .deb)
# All artifacts are attached to a GitHub Release for the tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daemon:
    name: daemon ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: daemon/go.sum
      - name: build
        working-directory: daemon
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          go build -ldflags "-s -w -X main.version=${VER}" \
            -o "jarjard-linux-${{ matrix.goarch }}" ./cmd/jarjard
      - name: release upload
        uses: softprops/action-gh-release@v2
        with:
          files: daemon/jarjard-linux-${{ matrix.goarch }}

  client:
    name: client ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: linux
            os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: install ui deps
        working-directory: client/ui
        run: npm install
      - name: build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the self-updater artifacts. Set these repo secrets before the
          # first tag: TAURI_SIGNING_PRIVATE_KEY (the minisign private key) and,
          # if the key has a password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "JarJar ${{ github.ref_name }}"
          # Publish (not draft) so the updater endpoint
          # /releases/latest/download/latest.json resolves.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
