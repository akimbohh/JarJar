name: Release

# Produces platform artifacts for a version:
#   - jarjard daemon binaries: linux/amd64, linux/arm64 (the daemon is Linux-only
#     by design — it drives systemd + RCON)
#   - tray-client installers: Windows (NSIS .exe), macOS (.dmg, universal),
#     Linux (.AppImage + .deb), plus signed self-updater artifacts + latest.json
#
# Trigger either by pushing a v* tag, or manually (Actions → Release → Run
# workflow) with the version tag as input — handy when tag pushes are blocked.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # The release tag: the pushed tag, or the manual-dispatch input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Client first: it creates the GitHub Release for RELEASE_TAG (and the tag
  # itself on manual dispatch). The daemon job then uploads into that release.
  client:
    name: client ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: linux
            os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: install ui deps
        working-directory: client/ui
        run: npm install
      - name: build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the self-updater artifacts. Requires the repo secret
          # TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD only if the key has one).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "JarJar ${{ env.RELEASE_TAG }}"
          # Publish (not draft) so the updater endpoint
          # /releases/latest/download/latest.json resolves.
          releaseDraft: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  daemon:
    name: daemon ${{ matrix.goarch }}
    needs: client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: daemon/go.sum
      - name: build
        working-directory: daemon
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w -X main.version=${RELEASE_TAG}" \
            -o "jarjard-linux-${{ matrix.goarch }}" ./cmd/jarjard
      - name: release upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: daemon/jarjard-linux-${{ matrix.goarch }}
