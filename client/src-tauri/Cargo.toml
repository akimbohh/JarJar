[package]
name = "jarjar-client"
version = "0.1.0"
description = "JarJar tray client"
authors = ["JarJar"]
edition = "2021"
rust-version = "1.77"

# Standalone crate (not part of a workspace) so it can be checked/built on its own.
[[bin]]
name = "jarjar-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP strictly via reqwest with rustls (no OpenSSL, no tauri-plugin-http).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }

# Streaming SHA-256.
sha2 = "0.10"
hex = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
futures-util = "0.3"

directories = "5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Tauri custom-protocol for release builds; on by default via tauri.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
